{% extends "base.html" %}
{% block title %}Удалить пользователя{% endblock %}
{% block content %}
<div class="container-fluid">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <section class="card">
        <div class="card-body p-4">
          <h1 class="h4 mb-3">Удалить пользователя?</h1>
          <p class="mb-4">
            Будет удалён аккаунт <strong>{{ object.get_full_name|default:object.username }}</strong>
            <span class="text-muted">({{ object.username }})</span>. Это действие нельзя отменить.
          </p>
          <form method="post" class="d-flex gap-2 justify-content-end">
            {% csrf_token %}
            <a href="{% url 'accounts:user_list' %}" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i>Удалить</button>
          </form>
        </div>
      </section>
    </div>
  </div>
</div>
{% endblock %}
