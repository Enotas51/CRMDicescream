<div class="modal fade" id="taskInfoModal" tabindex="-1" aria-labelledby="taskInfoModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="taskInfoModalLabel">Задача</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button></div>
    <div class="modal-body"><h3 class="h5" data-task-info-title data-info-title></h3><p class="text-muted" data-info-meta></p><p class="dashboard-modal-description" data-task-info-description data-info-description></p><p class="dashboard-modal-extra" data-info-extra></p><dl class="row mb-0"><dt class="col-5">Проект</dt><dd class="col-7" data-task-info-project data-info-project></dd><dt class="col-5">Статус</dt><dd class="col-7" data-task-info-status data-info-status></dd><dt class="col-5">Приоритет</dt><dd class="col-7" data-task-info-priority data-info-priority></dd><dt class="col-5">Исполнитель</dt><dd class="col-7" data-task-info-assignee data-info-assignee></dd><dt class="col-5">Срок</dt><dd class="col-7" data-task-info-due data-info-due></dd></dl></div>
    <div class="modal-footer"><a class="btn btn-primary" data-task-info-open data-info-open href="#">Открыть задачу</a>{% if can_edit %}<a class="btn btn-outline-secondary dashboard-modal-icon-action" data-task-info-edit data-info-edit href="#" title="Редактировать" aria-label="Редактировать"><i class="bi bi-pencil"></i></a><a class="btn btn-outline-danger dashboard-modal-icon-action" data-task-info-delete data-info-delete href="#" title="Удалить" aria-label="Удалить"><i class="bi bi-trash"></i></a>{% endif %}</div>
  </div></div>
</div>
